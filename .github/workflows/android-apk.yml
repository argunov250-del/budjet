name: Android APK

on:
  push:
    branches: [main, claude/orchestrator-task-delegation-xf9m85]
    paths:
      - "app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Prebuild Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          short="${GITHUB_SHA::7}"
          src=$(ls app/android/app/build/outputs/apk/release/*.apk | head -n1)
          mkdir -p dist-apk
          cp "$src" "dist-apk/Rovno-${short}.apk"
          echo "path=dist-apk/Rovno-${short}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Rovno-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Delete previous release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-apk --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true

      - name: Prepare release notes
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          {
            echo "Commit: ${GITHUB_SHA}"
            echo
            echo "${MSG:-manual run}"
          } > release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          target_commitish: ${{ github.sha }}
          name: "Ровно — последняя сборка"
          body_path: release-body.md
          prerelease: true
          overwrite_files: true
          files: ${{ steps.apk.outputs.path }}
